[project]
name = "bdi-termcheck"
version = "0.1.0"
description = "Terminologiecontrole en SKOS-export voor de BDI Referentiearchitectuur"
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "rdflib>=7.0"]

[project.scripts]
bdi-termcheck = "bdi_termcheck.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
