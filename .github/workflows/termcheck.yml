name: Terminologiecontrole

on:
  schedule:
    - cron: "0 6 * * 1"       # elke maandag 06:00 UTC
  workflow_dispatch:           # knop om hem handmatig te starten
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installeren
        run: pip install -e ".[dev]"

      - name: Tests
        run: pytest -q

      - name: Documentatie ophalen en analyseren
        run: bdi-termcheck run --refresh

      - name: SKOS-bestand bijwerken
        run: bdi-termcheck vocab --offline

      - name: Rapport als artifact bewaren
        uses: actions/upload-artifact@v4
        with:
          name: terminologie-rapport
          path: |
            reports/report.md
            reports/findings.csv
            vocab/bdi.ttl

      - name: Wijzigingen terugcommitten
        if: github.event_name != 'pull_request'
        run: |
          git config user.name  "termcheck-bot"
          git config user.email "bot@users.noreply.github.com"
          git add reports vocab
          git diff --staged --quiet || git commit -m "chore: terminologierapport bijgewerkt"
          git push
